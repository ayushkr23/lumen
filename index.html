<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#110e0c" />
  <title>Lumen</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='11' fill='none' stroke='%23f0a05a' stroke-width='3'/%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Outfit:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="lamp" aria-hidden="true"></div>
  <main class="app">
    <header class="top">
      <div class="intro">
        <p class="eyebrow" id="today"></p>
        <h1>Lumen</h1>
        <p class="lede" id="lede"></p>
      </div>
      <div class="meter-wrap" id="meter-wrap" role="img" aria-label="No tasks yet">
        <svg viewBox="0 0 84 84" aria-hidden="true">
          <circle class="meter-track" cx="42" cy="42" r="28" />
          <circle class="meter-value" id="meter" cx="42" cy="42" r="28" transform="rotate(-90 42 42)" />
        </svg>
        <div class="meter-label" aria-hidden="true">
          <strong id="open-count">0</strong>
          <span>open</span>
        </div>
      </div>
    </header>

    <form class="composer" id="composer" autocomplete="off">
      <label class="sr" for="task-input">New task</label>
      <input id="task-input" maxlength="240" placeholder="Add a task, then press Enter" />
      <button class="add" type="submit">
        <svg class="plus" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M12 5v14M5 12h14" />
        </svg>
        Add
      </button>
    </form>

    <div class="filters" id="filters" role="tablist" aria-label="Filter tasks">
      <span class="filters-glider" id="glider" aria-hidden="true"></span>
      <button type="button" role="tab" data-filter="open" aria-selected="true">Open <span class="count">0</span></button>
      <button type="button" role="tab" data-filter="done" aria-selected="false">Done <span class="count">0</span></button>
      <button type="button" role="tab" data-filter="all" aria-selected="false">All <span class="count">0</span></button>
    </div>

    <ul class="list" id="list" aria-label="Tasks"></ul>
    <p class="empty" id="empty" hidden>
      <span class="empty-mark" aria-hidden="true"></span>
      <span id="empty-copy"></span>
    </p>

    <div class="bar">
      <button type="button" class="clear" id="clear" disabled>Clear completed</button>
      <p class="hint">Drag the grip, or Alt + arrows</p>
    </div>
    <p class="sr" id="status" aria-live="polite"></p>
  </main>
  <script src="app.js"></script>
</body>
</html>
